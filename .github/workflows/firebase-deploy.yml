name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main, v33, master ]
    paths:
      - 'firebase_landing/**'

jobs:
  deploy_hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_YT_C_C }}'
          channelId: live
          projectId: yt-c-c
          entryPoint: firebase_landing
