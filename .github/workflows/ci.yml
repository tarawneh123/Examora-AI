name: Examora AI CI & Test Suite

on:
  push:
    branches: [ main, v33, master ]
  pull_request:
    branches: [ main, v33, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 cryptography
      - name: Run Core Test Suite
        run: |
          python -m unittest discover -s tests
      - name: Run Online Backend Test Suite
        run: |
          cd online_backend && python -m unittest discover -s tests
