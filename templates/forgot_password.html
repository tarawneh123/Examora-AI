<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور - منصة الاختبارات التعليمية</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      background: radial-gradient(circle at 50% 15%, rgba(37, 99, 235, 0.08), transparent 55%),
                  radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.06), transparent 45%),
                  var(--bg, #f8fafc);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: 'Cairo', sans-serif;
      color: var(--text, #0f172a);
      margin: 0;
    }

    .reset-card {
      max-width: 460px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 20px;
      padding: 38px 32px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
      text-align: right;
      position: relative;
      overflow: hidden;
    }

    .reset-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
    }

    .icon-box {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }

    .alert-box {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert-box.danger {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: flex;
    }

    .alert-box.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: flex;
    }
  </style>
</head>
<body>

<div class="reset-card">
  <div style="text-align: center; margin-bottom: 24px;">
    <div class="icon-box">🔐</div>
    <h1 style="font-size: 21px; font-weight: 800; margin: 0 0 6px;">استعادة كلمة المرور</h1>
    <p style="font-size: 13px; color: var(--text-muted, #64748b); margin: 0; line-height: 1.6;">
      أدخل بريدك الإلكتروني المسجل في المنصة، وسيقوم النظام بإرسال رابط رسمي ومباشر لإعادة تعيين كلمة السر إلى بريدك فوراً.
    </p>
  </div>

  <div id="resetAlert" class="alert-box">
    <span id="resetAlertIcon">⚠️</span>
    <span id="resetAlertText"></span>
  </div>

  <form id="resetForm" onsubmit="handlePasswordReset(event)">
    <div class="form-group" style="margin-bottom: 20px;">
      <label style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px;">البريد الإلكتروني المعتمد:</label>
      <input type="email" id="resetEmail" class="form-control" placeholder="teacher@example.com" required autofocus style="width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 13.5px; box-sizing: border-box;">
    </div>

    <button type="submit" id="resetBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 800; border-radius: 10px; font-size: 14px;">
      📨 إرسال رابط استعادة كلمة المرور إلى البريد ←
    </button>
  </form>

  <div style="margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 16px; text-align: center; font-size: 13px;">
    <a href="{{ url_for('login') }}" style="color: var(--primary, #2563eb); font-weight: 700; text-decoration: none;">
      ← العودة إلى صفحة تسجيل الدخول
    </a>
  </div>
</div>

<script>
  function showAlert(msg, type = 'danger') {
    const box = document.getElementById('resetAlert');
    const text = document.getElementById('resetAlertText');
    const icon = document.getElementById('resetAlertIcon');
    text.textContent = msg;
    box.className = `alert-box ${type}`;
    icon.textContent = type === 'success' ? '✓' : '⚠️';
    box.style.display = 'flex';
  }

  async function handlePasswordReset(e) {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    const btn = document.getElementById('resetBtn');

    btn.disabled = true;
    btn.textContent = 'جارٍ إرسال رابط الاستعادة...';

    try {
      const res = await fetch('/api/auth/send-reset-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      const d = await res.json();
      if (d.ok) {
        showAlert("✓ تم إرسال رابط رسمي ومباشر لإعادة تعيين كلمة المرور إلى بريدك الإلكتروني بنجاح! يرجى مراجعة صندوق الوارد (Inbox) أو الرسائل غير المرغوبة.", "success");
      } else {
        showAlert(d.error || 'تعذر إرسال الرابط، يرجى التأكد من صحة البريد الإلكتروني.', 'danger');
      }
    } catch (serverErr) {
      showAlert("تعذر الاتصال بالخادم لإرسال الرابط. يرجى المحاولة لاحقاً.", 'danger');
    }
    btn.disabled = false;
    btn.textContent = '📨 إرسال رابط استعادة كلمة المرور إلى البريد ←';
  }
</script>

</body>
</html>
