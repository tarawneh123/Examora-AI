<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Examora AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <style>
    .login-box {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 480px;
      margin: 40px auto;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }
    .login-box::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }
    .form-group label {
      color: #cbd5e1;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }
    .form-control {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 10px;
      width: 100%;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
      background: rgba(30, 41, 59, 0.9);
    }
    .login-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <nav class="navbar">
    <a href="index.html" class="brand-logo">
      <img src="assets/school_logo.png" alt="Examora AI Logo">
      <div class="brand-title">
        <span class="brand-title-main" style="font-size: 1.5rem;">Examora AI</span>
        <span class="brand-subtitle">بوابة الدخول السحابية</span>
      </div>
    </a>
    <a href="index.html" class="nav-btn nav-btn-glass">← العودة للرئيسية</a>
  </nav>

  <div class="container" style="display: flex; align-items: center; justify-content: center; padding: 20px 0;">
    <div class="login-box">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="font-size: 2.8rem; margin-bottom: 8px;">🔐</div>
        <h2 style="font-size: 1.7rem; font-weight: 900; color: #ffffff;">تسجيل دخول المعلمين والإدارة</h2>
        <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 4px;">منظومة Examora AI السحابية</p>
      </div>

      <div id="loginAlert" class="login-alert" style="display: none;"></div>

      <form onsubmit="handleCloudLogin(event)">
        <div class="form-group" style="margin-bottom: 18px;">
          <label for="userEmail">البريد الإلكتروني:</label>
          <input type="email" id="userEmail" class="form-control" placeholder="teacher@school.jo" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="userPassword">كلمة المرور:</label>
          <input type="password" id="userPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="portal-btn portal-btn-primary" style="width: 100%;" id="btnLoginSubmit">
          دخول المنظومة السحابية 🚀
        </button>
      </form>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 جميع الحقوق محفوظة منظومة Examora AI للتقييم والاختبارات الذكية © 2026 - جميع الحقوق محفوظة</p>
        <p class="designer-credit">
          <span class="designer-label">تصميم وتطوير:</span>
          <a href="https://htst-d.web.app/" target="_blank" rel="noopener noreferrer" class="logo-text">
            <span class="logo-char">H</span>
            <span class="logo-char">T</span>
            <span class="logo-space"></span>
            <span class="logo-char">S</span>
            <span class="logo-char">T</span>
            <span class="logo-char">U</span>
            <span class="logo-char">D</span>
            <span class="logo-char">I</span>
            <span class="logo-char">O</span>
            <span class="logo-space"></span>
            <span class="logo-char">D</span>
            <span class="logo-char">E</span>
            <span class="logo-char">S</span>
            <span class="logo-char">I</span>
            <span class="logo-char">G</span>
            <span class="logo-char">N</span>
          </a>
        </p>
      </div>
    </div>
  </footer>

  <script>
    async function handleCloudLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      alertBox.style.display = 'none';

      const email = document.getElementById('userEmail').value.trim().toLowerCase();
      const password = document.getElementById('userPassword').value;
      const btn = document.getElementById('btnLoginSubmit');

      btn.disabled = true;
      btn.textContent = 'جارٍ التحقق من الهوية السحابية...';

      try {
        const userCred = await auth.signInWithEmailAndPassword(email, password);
        const idToken = await userCred.user.getIdToken();

        const backendUrl = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1')
          ? '' : 'http://localhost:8765';

        const resp = await fetch(`${backendUrl}/api/auth/firebase-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken: idToken })
        });

        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          alertBox.textContent = data.error || 'تعذر المصادقة مع الخادم المحلي.';
          alertBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'دخول المنظومة السحابية 🚀';
          return;
        }

        window.location.href = data.redirect || '/';

      } catch (err) {
        console.error(err);
        alertBox.textContent = 'بيانات الدخول غير صحيحة أو الحساب غير مسجل.';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'دخول المنظومة السحابية 🚀';
      }
    }
  </script>
</body>
</html>
